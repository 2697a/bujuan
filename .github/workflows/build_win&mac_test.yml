name: Build Windows (Debug)

on:
#   push:
#     branches: [ build ]          # 根据需要修改分支
#   pull_request:
#     branches: [ build ]
  workflow_dispatch:             # 允许手动触发

jobs:
  windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Locate Windows build output
        id: find_windows
        shell: pwsh
        run: |
          # 优先查找 runner/Release 目录下的 .exe（排除 CMakeFiles 临时文件）
          $exePath = Get-ChildItem -Path build\windows -Recurse -Filter "*.exe" |
                     Where-Object { $_.FullName -notmatch "CMakeFiles" } |
                     Where-Object { $_.FullName -match "runner\\Release" } |
                     Select-Object -First 1 |
                     ForEach-Object { $_.Directory.FullName }

          if (-not $exePath) {
            # 降级：查找任何非 CMakeFiles 的 .exe
            $exePath = Get-ChildItem -Path build\windows -Recurse -Filter "*.exe" |
                       Where-Object { $_.FullName -notmatch "CMakeFiles" } |
                       Select-Object -First 1 |
                       ForEach-Object { $_.Directory.FullName }
          }

          if ($exePath) {
            Write-Host "Found Windows executable in: $exePath"
            echo "path=$exePath" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "::error::Windows build output not found"
            exit 1
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ steps.find_windows.outputs.path }}