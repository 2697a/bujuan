name: Build (Windows & macOS)

on:
  push:
    branches: [ build ]
  pull_request:
    branches: [ build ]
  workflow_dispatch:

jobs:
  windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Locate Windows build output
        id: find_windows
        shell: pwsh
        run: |
          # 查找 Runner.exe 所在的目录（Release 文件夹）
          $path = Get-ChildItem -Path build -Recurse -Filter "Runner.exe" | Select-Object -First 1 | % { $_.Directory.FullName }
          if ($path) {
            echo "Found at: $path"
            echo "path=$path" >> $env:GITHUB_OUTPUT
          } else {
            echo "::error::Windows build output not found"
            exit 1
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ steps.find_windows.outputs.path }}

  macos:
    name: Build macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Locate macOS build output
        id: find_macos
        run: |
          # 查找 Runner.app 目录
          APP_PATH=$(find build -type d -name "Runner.app" | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "Found at: $APP_PATH"
            echo "path=$APP_PATH" >> $GITHUB_OUTPUT
          else
            echo "::error::macOS app not found"
            exit 1
          fi

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: ${{ steps.find_macos.outputs.path }}