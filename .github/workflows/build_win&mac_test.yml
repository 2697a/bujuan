name: Build (Windows & macOS)

on:
#  push:
#    branches: [ build ]
#  pull_request:
#    branches: [ build ]
  workflow_dispatch:

jobs:
  windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Debug - List Windows build output
        shell: pwsh
        run: |
          Write-Host "Contents of build directory:"
          Get-ChildItem -Path build -Recurse | Select-Object FullName

      - name: Locate Windows build output
        id: find_windows
        shell: pwsh
        run: |
          # 查找任意 .exe 文件（可能是 Runner.exe 或项目名.exe）
          $exePath = Get-ChildItem -Path build -Recurse -Filter "*.exe" | Select-Object -First 1 | % { $_.Directory.FullName }
          if ($exePath) {
            echo "Found exe at: $exePath"
            echo "path=$exePath" >> $env:GITHUB_OUTPUT
          } else {
            echo "::error::No .exe found in build directory. See above for directory tree."
            exit 1
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ steps.find_windows.outputs.path }}

  macos:
    name: Build macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Debug - List macOS build output
        run: |
          echo "Contents of build directory:"
          find build -type f -o -type d | head -50

      - name: Locate macOS build output
        id: find_macos
        run: |
          # 查找任意 .app 目录
          APP_PATH=$(find build -type d -name "*.app" | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "Found app at: $APP_PATH"
            echo "path=$APP_PATH" >> $GITHUB_OUTPUT
          else
            echo "::error::No .app found in build directory. See above for directory listing."
            exit 1
          fi

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: ${{ steps.find_macos.outputs.path }}